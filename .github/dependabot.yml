# NFR5: update pull requests for the dependency surface. NuGet covers all of it: the web app
# is Blazor WebAssembly, so there is no second package ecosystem to watch (sprint change
# 2026-09-21).
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # One pull request for the test stack rather than one per package.
      testing:
        patterns:
          - xunit*
          - NetArchTest*
          - Testcontainers*
          - Microsoft.Playwright

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
